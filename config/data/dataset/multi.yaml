info:
  max_seq_length: 500
  seq_length: 30
  feature_dim: 6

simulation_config:
  _target_: data.simulation.dataset.SimulationDataset
  data_path: ${oc.env:SIMULATION_DATA_PATH}
  target_frame_count: ${training.model.data_format.seq_length}
  normalization_frame_count: ${data.dataset.info.seq_length}
  normalize: true

ccdm_config:
  _target_: data.ccdm.CCDMDataset
  data_path: ${oc.env:CCDM_DATA_DIR}/data.npy
  # Mixed categorical training needs translations of the native captions.
  # CCDMDataset verifies schema, source IDs and exact caption alignment.
  annotations_path: ${oc.env:CCDM_ANNOTATIONS_PATH,null}
  sample_indices_path: null
  normalize: true
  original_seq_len: 300
