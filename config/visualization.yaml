    - los: "#457B9D"
    - trajectory: "#D08C60"
    - total: "#E63946"  

clip_structure:
  cinematography:
    initial:    
      - clip_elements_0     # initial_cameraAngle
      - clip_elements_1     # initial_shotSize
      - clip_elements_2     # initial_subjectView
      - clip_elements_3     # initial_subjectFraming
    movement:        
      - clip_elements_4     # movement_type
      - clip_elements_5     # movement_speed
    final:           
      - clip_elements_6     # final_cameraAngle
      - clip_elements_7     # final_shotSize
      - clip_elements_8     # final_subjectView
      - clip_elements_9     # final_subjectFraming
  simulation:         
    initial_setup:   
      - clip_elements_10    # initialSetup_cameraAngle
      - clip_elements_11    # initialSetup_shotSize
      - clip_elements_12    # initialSetup_subjectView
      - clip_elements_13    # initialSetup_subjectFraming_position
      - clip_elements_14    # initialSetup_subjectFraming_dutchAngleScale
      - clip_elements_15    # setup_kind
    dynamic:       
      - clip_elements_16    # dynamic_type
      - clip_elements_17    # dynamic_easing
      - clip_elements_18    # dynamic_randomness
      - clip_elements_19    # dynamic_complementSetup_cameraAngle
      - clip_elements_20    # dynamic_complementSetup_shotSize
      - clip_elements_21    # dynamic_complementSetup_subjectView
      - clip_elements_22    # dynamic_complementSetup_subjectFraming_position
      - clip_elements_23    # dynamic_complementSetup_subjectFraming_dutchAngleScale
      - clip_elements_24    # dynamic_subjectAwareInterpolation
      - clip_elements_25    # dynamic_scale
      - clip_elements_26    # dynamic_direction
      - clip_elements_27    # dynamic_movementMode
    constraints:    
      - clip_elements_28    # constraints_allFramesVisibility
      - clip_elements_29    # constraints_staticDistance
      - clip_elements_30    # constraints_staticCameraSubjectRotation
      - clip_elements_31    # constraints_lockedMovement_left
      - clip_elements_32    # constraints_lockedMovement_right
      - clip_elements_33    # constraints_lockedMovement_up
      - clip_elements_34    # constraints_lockedMovement_down
      - clip_elements_35    # constraints_lockedMovement_forward
      - clip_elements_36    # constraints_lockedMovement_backward
      - clip_elements_37    # constraints_lockedRotation_left
      - clip_elements_38    # constraints_lockedRotation_right
      - clip_elements_39    # constraints_lockedRotation_up
      - clip_elements_40    # constraints_lockedRotation_down
      - clip_elements_41    # constraints_lockedRotation_rollClockwise
      - clip_elements_42    # constraints_lockedRotation_rollNonClockwise
      - clip_elements_43    # constraints_maxAccelerate
      - clip_elements_44    # constraints_maxSpeed
      - clip_elements_45    # constraints_importance
