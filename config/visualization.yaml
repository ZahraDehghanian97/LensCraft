    - clip_4:  "#457B9D"
    - clip_5:  "#9B5DE5"
    # Final: Red
    - clip_6:  "#E63946"
    - clip_7:  "#F4A261"
    - clip_8:  "#E9C46A"
    - clip_9:  "#2A9D8F"
  # Simulation Instruction:
