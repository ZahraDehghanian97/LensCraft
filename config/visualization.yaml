defaults:
  - _self_
  - hydra: default

logdir: ${oc.env:TENSORBOARD_LOG_DIR,lightning_logs/version_133}
save_plot: ${oc.env:PLOT_SAVE_PATH,./visualization/tensorboard_plot_}

plot:
  figsize:
    width: 23
    height: 18
  style:
    plt_style: "bmh"
    major_grid_style:
      which: "major"
      linestyle: "-"
      linewidth: 1.0
      alpha: 1.0
      color: "#4a4a4a"
    minor_grid_style:
      which: "minor"
      linestyle: "--"
      linewidth: 0.7
      alpha: 0.75
      color: "#828282"
    title: "Training and Validation Metrics"
    title_params:
      fontsize: 34
      fontweight: "bold"
      pad: 20
      y: 1.01
    xlabel: "Step"
    ylabel: "Value"
    labelpad: 20
    suptitle_font_size: 42
    title_font_weight: "bold"
    suptitle_font_weight: "bold"
    font_size: 26
    font_family: "MathJax_SansSerif"
    apply_fixed_ylim_clip: true
    suptitle_offset: 0.995
    xticks_pad: 15
    yticks_pad: 15
    border_color: "black"
    border_linewidth: 1
  n_cols: 3
  tight_layout: true

metrics:
  losses_list:
    - clip
    - contrastive
    - first_frame_loss
    - relative_loss
    - speed
    - cycle
    - total

  contrastive:
    - val_contrastive_epoch
    - train_contrastive_epoch

  total_loss:
    - val_total_epoch
    - train_total_epoch
  
  first_frame_loss:
    - val_first_frame_epoch
    - train_first_frame_epoch

  relative_loss:
    - val_relative_epoch
    - train_relative_epoch
  
  speed_loss:
    - val_speed_epoch
    - train_speed_epoch

  cycle_loss:
    - val_cycle_epoch
    - train_cycle_epoch
    

  clips:
    num_clips: 46
    categorize_embeddings: true
    average_clip_loss: true # to enable this option, 'clip' should be in 'losses_list'
    include_validation: true
    include_training: true
  

event_accumulator:
  size_guidance:
    scalars: 0
    histograms: 0
    images: 0
    tensors: 0

output:
  show_plot: false
  save_plot: true
  print_available_tags: false
  plot_format: "png"
  dpi: 100
  
line_styles:
  training:
    linestyle: "--"
    linewidth: 2.5
    alpha: 0.4
  validation:
    linestyle: "-"
    linewidth: 2.5
    alpha: 1.0


legend:
  loc: "upper center"
  fontsize: 20
  frameon: true
  framealpha: 0.8
  bbox_to_anchor: [0.5, -0.15]
  ncol: 3
  shadow: true
  fancybox: true
  borderpad: 1.2


color_map:
