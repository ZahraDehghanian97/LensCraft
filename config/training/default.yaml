_target_: training.autoencoder_trainer.LightningLensCraft

defaults:
  - model: default
  - optimizer: adamW
  - lr_scheduler: root_warmup_cosine
  - clip_weights@loss_module.clip_weights: default

loss_module:
  _target_: training.losses.losses.CameraTrajectoryLoss
  losses_list:
    clip:             1000     # η  (L_clip)
    first_frame:      2      #    (L_init — coefficient 1 in Eq. 7)
    relative:         16      # φ  (L_rel)
    speed:            80     # τ  (L_speed)
    rotation_absolute: 2    # all-frame orientation after SO(3) projection
    rotation_raw:      1    # raw matrices toward proper target rotations
    keyframe_position: 4   # mean error on supplied valid poses only
    keyframe_rotation: 2  # SO(3) chordal error on supplied valid poses only
    cycle:            100      # ς  (L_cycle)
    # contrastive:      5
  rotation_weight: 1.0       # scales every rotation term relative to position
  weighted_clip_loss: false
  weight_power: 1
  contrastive_loss_version: 3         # Select between versions [1, 2, 3]
  clip_embeddings:
    _target_: data.simulation.init_embeddings.initialize_all_clip_embeddings
    clip_model_name: ${clip.model_name}
    cache_file: ${oc.env:CLIP_EMBEDDINGS_CACHE_DIR,.}/clip_embeddings_${clip.model_name}_cache.pkl
    embedding_dimension: ${clip.latent_dim}
    embedding_mode: "default" # choose between ["default", "normal"]
  encoder_loss_function: "clip" # choose between ["clip", "mse"]

noise:
  initial_std: 1.0
  final_std: 0.0

# Sample one mode per batch. Every family stays active throughout training;
# keyframe modes use clean supplied frames and the same K values as evaluation.
conditioning:
  enabled: true
  mode_weights:
    prompt_generation: 1.0
    reconstruction: 1.0
    key_framing: 1.0
    key_framing+prompt: 1.0
  keyframe_counts: [1, 2, 4, 8, 26]

# Extra mode validation uses a deterministic prefix of the validation loader.
# Prompt val_loss still covers the full configured validation loader.
validation_conditioning:
  enabled: true
  keyframe_counts: [1, 2, 4, 8, 26]
  max_batches: 4
  seed: 42
  known_pose_weight: 1.0

mask:
  initial_ratio: 0.1
  final_ratio: 0.8
  memory_ratio: 0.0

teacher_forcing_schedule:
  # Legacy schedule: used only when conditioning.enabled=false.
  memory_initial_ratio: 0.7
  memory_final_ratio: 1.0
  trajectory_initial_ratio: 1.0
  trajectory_final_ratio: 0.1

use_merged_memory: false
decode_mode: "single_step"
use_cycle_consistency: true
