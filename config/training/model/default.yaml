data_format:
  type: simulation
  seq_length: 30

module:
  _target_: models.camera_trajectory_model.LensCraft
  input_dim: 6
  subject_dim: 6
  latent_dim: 256
  nhead: 8
  num_encoder_layers: 4
  num_decoder_layers: 4
  dim_feedforward: 1024
  dropout_rate: 0.3
  seq_length: ${training.model.data_format.seq_length}
  # Explicit pose-query conditioning is a keyframe training policy.
  keyframe_pose_conditioning: false

inference:
  checkpoint_path: ${oc.env:TEST_CHECKPOINT_PATH}
  config: ${oc.env:TEST_CONFIG_PATH,null}
