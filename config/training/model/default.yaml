data_format: 
  type: simulation
  seq_length: 30

module:
  _target_: models.camera_trajectory_model.LensCraft
  input_dim: 6
  subject_dim: 6
  nhead: 8
  num_encoder_layers: 4
  num_decoder_layers: 4
  dim_feedforward: 2048
  dropout_rate: 0.3
  seq_length: ${training.model.data_format.seq_length}
  latent_dim: ${clip.latent_dim}
  use_merged_memory: ${training.use_merged_memory}
  denormalize_memory: false
  # Experimental direct pose/time/presence queries; requires training/finetuning.
  keyframe_pose_conditioning: false
  camera_memory_norms:
    _target_: data.simulation.memory_norms.vocabulary_memory_norms
    clip_embeddings: ${training.loss_module.clip_embeddings}
    embedding_dim: ${clip.latent_dim}

inference:
  checkpoint_path: ${oc.env:TEST_CHECKPOINT_PATH}
  config: ${oc.env:TEST_CONFIG_PATH,None}
  clip_embeddings_cache: ${oc.env:CLIP_EMBEDDINGS_CACHE_DIR,.}/clip_embeddings_${clip.model_name}_cache.pkl
  # Applies to restored legacy configs too; use none to reproduce raw memory.
  camera_memory_normalization: vocabulary
  clip_model_name: ${clip.model_name}
