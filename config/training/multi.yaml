_target_: training.multi_dataset_trainer.MultiDatasetTrainer

defaults:
  - model: default
  - optimizer: adamW
  - lr_scheduler: root_warmup_cosine
  - _self_

loss_module:
  _target_: training.losses.categorical_loss.CategoricalCameraTrajectoryLoss
  losses_list:
    categorical: 1.0
    cycle: 1.0
    first_frame: 2
    relative: 16
    speed: 80
    rotation_absolute: 2
    rotation_raw: 1
    keyframe_position: 4
    keyframe_rotation: 2
  rotation_weight: 1.0

noise:
  initial_std: 1.0
  final_std: 0.0
mask:
  initial_ratio: 0.1
  final_ratio: 0.8
  memory_ratio: 0.0
teacher_forcing_schedule:
  memory_initial_ratio: 0.2
  memory_final_ratio: 0.8
  trajectory_initial_ratio: 0.7
  trajectory_final_ratio: 0.1

decode_mode: autoregressive
sim_weight: 0.6
ccdm_weight: 0.4
