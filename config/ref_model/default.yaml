# Frozen semantic judge only; this encoder cannot generate trajectories.
data_format:
  type: simulation
  seq_length: 30

module:
  _target_: testing.metrics.semantic_evaluator.FrozenSemanticEvaluator
  input_dim: 6
  subject_dim: 6
  latent_dim: 512
  nhead: 8
  num_encoder_layers: 4
  num_query_tokens: 46
  dim_feedforward: 2048
  dropout_rate: 0.3
  seq_length: 30

clip:
  model_name: clip-vit-base-patch32
  latent_dim: 512

inference:
  checkpoint_path: ${oc.env:SEMANTIC_EVALUATOR_CHECKPOINT_PATH,null}
  config: ${oc.env:SEMANTIC_EVALUATOR_CONFIG_PATH,null}
